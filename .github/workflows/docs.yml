name: docs

# Docs deployment is opt-in (manual dispatch only), not triggered on every push
# to main. The previous auto-deploy used `mkdocs gh-deploy --force`, which
# overwrote the gh-pages history on every merge; manual dispatch plus a
# non-forced deploy keeps the docs history and avoids racing deploys.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.3"
      
      - name: Create virtual environment
        run: uv venv
      
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install hatchling mkdocs-material "mkdocstrings[python]" mkdocs-macros-plugin
          uv build
          pip install dist/*.whl
      
      - name: Deploy documentation
        run: |
          source .venv/bin/activate
          uv run mkdocs gh-deploy
