name: test
on:
  push:
  schedule:
    # Nightly run of the heavy statistical-validity (slow) lane.
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares requires-python = ">=3.9"; cover the minimum,
        # the documented .python-version, and the newest stable.
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies (retry on transient CDN failure)
        run: |
          for i in 1 2 3; do
            if uv sync --extra ci; then
              echo "uv sync succeeded on attempt $i"
              break
            fi
            if [ "$i" -ge 3 ]; then
              echo "ERROR: uv sync failed after 3 attempts" >&2
              exit 1
            fi
            echo "uv sync failed (attempt $i), retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
      - name: "Guard - dev (secret research) files must remain untracked"
        run: |
          # `*_dev.py` files are gitignored by design. If any get committed,
          # fail immediately so the leak is caught at PR time, not on PyPI.
          if git ls-files 'src/online_cp/**/*_dev.py' 'tests/**/*_dev.py' | grep -q .; then
            echo "ERROR: gitignored _dev (development) files are tracked:"
            git ls-files 'src/online_cp/**/*_dev.py' 'tests/**/*_dev.py'
            exit 1
          fi
          echo "OK: no _dev files tracked"
      - name: Parse libraries and run doctests (./scripts/run-modules)
        run: uv run ./scripts/run-modules
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - run: uv run ./scripts/run-notebooks
      - run: uv run validate-pyproject pyproject.toml
      # Fast lane (structural leancheck + unit tests). The 'slow' statistical
      # tests are excluded by default via addopts in pyproject.toml.
      - run: uv run pytest
      - run: uv run ./scripts/run-coverage

  statistical:
    # Heavy statistical-validity lane: nightly schedule or manual dispatch only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Heavy statistical-validity lane: nightly schedule or manual dispatch only.
    # Measured wall time is ~15 min on a standard runner (the expensive
    # kernel-ridge / Mondrian-forest / Mondrian-CPS tests are held at their
    # original stream count; see tests/test_statistical.py). 45 min gives a
    # comfortable margin over a cold numba-JIT run while bounding a hang.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Install dependencies (retry on transient CDN failure)
        run: |
          for i in 1 2 3; do
            if uv sync --extra ci; then
              echo "uv sync succeeded on attempt $i"
              break
            fi
            if [ "$i" -ge 3 ]; then
              echo "ERROR: uv sync failed after 3 attempts" >&2
              exit 1
            fi
            echo "uv sync failed (attempt $i), retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
      - name: Run slow statistical-validity tests
        run: uv run pytest -m slow
